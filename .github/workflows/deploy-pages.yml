name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'docs/**'
      - 'modifier/**'
      - 'resource/**'
      - 'build/**'
      - '*.cs'
      - 'UnattendGenerator.csproj'
      - '.github/workflows/deploy-pages.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: 'デプロイ対象の指定 (auto / preview / release / both)'
        required: false
        default: 'preview'
        type: choice
        options:
          - auto
          - preview
          - release
          - both

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # release イベント時は同一コミット SHA に対する GitHub Pages バックエンドのサイレントスキップを回避するため、
  # workflow_dispatch を自動発火（トランポリン）させて本番リリースデプロイを実行する。
  trigger-dispatch:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger deployment via workflow_dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          echo "Release published: $TAG_NAME. Triggering workflow_dispatch for release deployment..."
          gh workflow run deploy-pages.yml --repo "$REPO" -f target=release --ref "${{ github.event.repository.default_branch || 'master' }}"

  # 実際のビルド＆デプロイは push または workflow_dispatch で実行
  deploy:
    if: github.event_name != 'release'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure all tags are fetched
        run: |
          git fetch --tags --force

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build / Stage Pages Content
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          DISPATCH_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          echo "=== Deploy Condition Check ==="
          echo "Event Name: $EVENT_NAME"

          # 作業用クリーンディレクトリの準備
          rm -rf _site _src_clean _tag_docs _tag_clean
          mkdir -p _site
          mkdir -p _src_clean

          # 最新リリースタグの特定
          LATEST_TAG=""
          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1 || echo "")
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG=$(git describe --tags --abbrev=0 $(git rev-list --tags --max-count=1) 2>/dev/null || echo "")
          fi
          if [ -z "$LATEST_TAG" ] && command -v gh &> /dev/null; then
            LATEST_TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "")
          fi
          echo "Identified Latest Release Tag: $LATEST_TAG"

          # 0. Modifier 同期・整合性チェック
          echo "Running Modifier synchronization check..."
          node build/sync_modifiers.js --check

          # 1. 最新コミットハッシュおよびリリースタグを注入してエンジンを再バンドル
          echo "Building unattend engine bundle with latest commit hash and release tag..."
          COMMIT_HASH="${{ github.sha }}" RELEASE_TAG="$LATEST_TAG" node build/build_engine.js

          # 2. パリティテストの自動実行（配信前の品質保証）
          echo "Running engine parity tests..."
          node test_tools/test_engine_parity.js
          echo "Running feature parity tests..."
          node test_tools/test_feature_parity.js

          # 3. 現在のブランチの docs/ から preview ディレクトリを除外して _src_clean にステージング
          echo "Staging clean sources from current branch (excluding preview/)..."
          cp -r ./docs/* _src_clean/
          rm -rf _src_clean/preview

          # 4. デプロイモードの判定
          DEPLOY_MODE="preview"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$DISPATCH_TARGET" = "release" ]; then
              DEPLOY_MODE="release"
            elif [ "$DISPATCH_TARGET" = "both" ]; then
              DEPLOY_MODE="both"
            elif [ "$DISPATCH_TARGET" = "preview" ]; then
              DEPLOY_MODE="preview"
            else
              # target=auto の場合: HEAD がタグと完全一致していれば release、それ以外は preview
              if git describe --exact-match --tags HEAD 2>/dev/null; then
                DEPLOY_MODE="release"
              else
                DEPLOY_MODE="preview"
              fi
            fi
          elif [ "$EVENT_NAME" = "push" ]; then
            # HEAD にリリースタグが付与されている場合は release モードとして扱う
            HEAD_TAG=$(git tag -l "v*" --points-at HEAD | head -n 1 || echo "")
            if [ -n "$HEAD_TAG" ]; then
              echo "HEAD is tagged with $HEAD_TAG. Promoting push deployment to release mode."
              DEPLOY_MODE="release"
            else
              DEPLOY_MODE="preview"
            fi
          fi

          echo "Determined DEPLOY_MODE: $DEPLOY_MODE"

          # 5. モードに応じた _site の構築
          if [ "$DEPLOY_MODE" = "release" ] || [ "$DEPLOY_MODE" = "both" ]; then
            echo "--- Release Deployment ---"
            echo "Publishing latest release to root (/)..."
            cp -r _src_clean/* _site/
            echo "Publishing latest release to preview (/preview/)..."
            mkdir -p _site/preview
            cp -r _src_clean/* _site/preview/
          else
            echo "--- Preview Deployment (main / master merge) ---"
            # ルート (/) には最新の安定リリースタグを展開し、本番提供中サイトを保護・維持
            echo "Staging stable release tag ($LATEST_TAG) for root site (/)..."

            if [ -n "$LATEST_TAG" ]; then
              echo "Extracting docs from tag $LATEST_TAG for root site (/)..."
              mkdir -p _tag_docs
              git archive "$LATEST_TAG" docs | tar -x -C ./_tag_docs/
              if [ -d "./_tag_docs/docs" ]; then
                mkdir -p _tag_clean
                cp -r ./_tag_docs/docs/* _tag_clean/
                rm -rf _tag_clean/preview
                # タグ展開成果物のヘッダー内の release リンクが古い表記の場合、該当タグ名に更新
                if [ -f "_tag_clean/sections/header.html" ]; then
                  sed -i -E "s|releases/tag/[^\"]*|releases/tag/${LATEST_TAG}|g" _tag_clean/sections/header.html || true
                  sed -i -E "s|id=\"header-release-link\">[^<]*<|id=\"header-release-link\">${LATEST_TAG}<|g" _tag_clean/sections/header.html || true
                fi
                cp -r _tag_clean/* _site/
                echo "Successfully staged stable release $LATEST_TAG to root (/)."
              else
                echo "Warning: docs folder not found in tag $LATEST_TAG. Falling back to current docs."
                cp -r _src_clean/* _site/
              fi
            else
              echo "Notice: No release tag found in repository. Using current docs for root."
              cp -r _src_clean/* _site/
            fi

            # プレビュー (/preview/) には現在の main/master の最新成果物を展開
            echo "Deploying current branch docs to preview (/preview/)..."
            # 万が一タグ資材に preview が含まれていた場合に備えてクリーンアップ
            rm -rf _site/preview
            mkdir -p _site/preview
            cp -r _src_clean/* _site/preview/
            echo "Successfully staged current branch docs to preview (/preview/)."
          fi

          # 6. Jekyll の静的ファイル無視・変換を防止するために .nojekyll を配置
          touch _site/.nojekyll
          touch _site/preview/.nojekyll

          # 作業一時ディレクトリの整理
          rm -rf _src_clean _tag_docs _tag_clean

          echo "=== Content Staging Complete ==="
          echo "--- Root (_site/) ---"
          ls -la _site
          echo "--- Preview (_site/preview/) ---"
          ls -la _site/preview

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5


