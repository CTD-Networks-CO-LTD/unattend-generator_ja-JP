# This workflow verifies JavaScript engine synchronization and parity with C# codebase
# Fork-specific CI pipeline separate from upstream dotnet.yml

name: Node.js Engine Parity

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10

      - name: Run Modifier Sync Check
        run: node build/sync_modifiers.js --check

      - name: Build Unattend Engine Bundle (without overwriting baseline)
        run: node build/build_engine.js

      - name: Run UI Parity & Upstream Structure Tests
        run: |
          node test_tools/test_upstream_ui_sync.js
          node test_tools/test_ui_parity.js

      - name: Run JS Baseline Regression Tests
        run: node test_tools/test_engine_parity.js

      - name: Run Feature Parity & AST Tests
        run: node test_tools/test_feature_parity.js

      - name: Run C# Oracle & Behavioral Contract Verification
        run: node test_tools/verify_csharp_oracle.js --require-dotnet

      - name: Run Custom Scripts & WinPE Full Lifecycle E2E Tests
        run: |
          node test_tools/verify_custom_scripts_e2e.js
          node test_tools/verify_phase4_e2e.js

