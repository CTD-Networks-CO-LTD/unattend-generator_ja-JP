<tr>
        <th>Password expiration:</th>
        <td>
          <div class="IndentContainer">
            <label class="radio">
              <input type="radio" name="PasswordExpirationMode" value="Unlimited" checked="checked" />
              <span>Passwords do not expire</span>
            </label>
            <div>This is in accordance to NIST guidelines that <a href="https://pages.nist.gov/800-63-FAQ/#q-b05">no longer recommend password expiration</a>.</div>
          </div>

          <div class="IndentContainer">
            <label class="radio">
              <input type="radio" name="PasswordExpirationMode" value="Default" />
              <span>Use Windows default</span>
            </label>
            <div>Passwords expire after <strong>42</strong> days.</div>
          </div>

          <div class="IndentContainer">
            <label class="radio">
              <input type="radio" name="PasswordExpirationMode" value="Custom" />
              <span>Use custom password expiration:</span>
            </label>
            <fieldset>Passwords expire after <input type="number" name="PasswordMaxAge" value="42" min="1" max="999" required="required" /> days.</fieldset>
          </div>

          <p>These settings only apply to local accounts. Also, the password of the built-in account <q>Administrator</q> never expires.</p>
        </td>
      </tr>
