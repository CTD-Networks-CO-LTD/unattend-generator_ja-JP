<tr>
        <th>Desktop icons:</th>
        <td>

          <div class="IndentContainer">
            <label class="checkbox">
              <input type="checkbox" name="DeleteEdgeDesktopIcon" value="true" />
              <span>Delete Edge shortcut on desktop</span>
            </label>
          </div>

          <div class="IndentContainer">
            <label class="radio">
              <input type="radio" name="DesktopIconsMode" value="Default" checked="checked" />
              <span>Show default desktop icons</span>
            </label>
          </div>

          <div class="IndentContainer">
            <label class="radio">
              <input type="radio" name="DesktopIconsMode" value="Custom" />
              <span>Show these desktop icons:</span>
            </label>
            <fieldset>
              <div class="DesktopIcons CheckboxList">
  <label class="checkbox">
    <input name="IconControlPanel" type="checkbox" value="true" />
    <span>Control Panel</span>
  </label>
  <label class="checkbox">
    <input name="IconDesktop" type="checkbox" value="true" />
    <span>Desktop</span>
  </label>
  <label class="checkbox">
    <input name="IconDocuments" type="checkbox" value="true" />
    <span>Documents</span>
  </label>
  <label class="checkbox">
    <input name="IconDownloads" type="checkbox" value="true" />
    <span>Downloads</span>
  </label>
  <label class="checkbox">
    <input name="IconGallery" type="checkbox" value="true" />
    <span>Gallery</span>
  </label>
  <label class="checkbox">
    <input name="IconHome" type="checkbox" value="true" />
    <span>Home</span>
  </label>
  <label class="checkbox">
    <input name="IconMusic" type="checkbox" value="true" />
    <span>Music</span>
  </label>
  <label class="checkbox">
    <input name="IconNetwork" type="checkbox" value="true" />
    <span>Network</span>
  </label>
  <label class="checkbox">
    <input name="IconPictures" type="checkbox" value="true" />
    <span>Pictures</span>
  </label>
  <label class="checkbox">
    <input name="IconRecycleBin" type="checkbox" value="true" />
    <span>Recycle bin</span>
  </label>
  <label class="checkbox">
    <input name="IconThisPC" type="checkbox" value="true" />
    <span>This PC</span>
  </label>
  <label class="checkbox">
    <input name="IconUserFiles" type="checkbox" value="true" />
    <span>User's Files</span>
  </label>
  <label class="checkbox">
    <input name="IconVideos" type="checkbox" value="true" />
    <span>Videos</span>
  </label>
</div>
            </fieldset>
          </div>

        </td>
      </tr>
