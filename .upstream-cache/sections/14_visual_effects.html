<tr>
        <th>Visual effects:</th>
        <td>

          <div class="IndentContainer">
            <label class="radio">
              <input type="radio" name="EffectsMode" value="Default" checked="checked" />
              <span>Use default settings chosen by Windows</span>
            </label>
          </div>

          <div class="IndentContainer">
            <label class="radio">
              <input type="radio" name="EffectsMode" value="Appearance" />
              <span>Adjust for best appearance</span>
            </label>
          </div>

          <div class="IndentContainer">
            <label class="radio">
              <input type="radio" name="EffectsMode" value="Performance" />
              <span>Adjust for best performance</span>
            </label>
          </div>

          <div class="IndentContainer">
            <label class="radio">
              <input type="radio" name="EffectsMode" value="Custom" />
              <span>Use custom settings:</span>
            </label>
            <fieldset>
              <div class="Effects CheckboxList">
  <label class="checkbox">
    <input name="ControlAnimations" type="checkbox" value="true" />
    <span>Animate controls and elements inside windows</span>
  </label>
  <label class="checkbox">
    <input name="AnimateMinMax" type="checkbox" value="true" />
    <span>Animate windows when minimizing and maximizing</span>
  </label>
  <label class="checkbox">
    <input name="TaskbarAnimations" type="checkbox" value="true" />
    <span>Animations in the taskbar</span>
  </label>
  <label class="checkbox">
    <input name="DWMAeroPeekEnabled" type="checkbox" value="true" />
    <span>Enable Peek</span>
  </label>
  <label class="checkbox">
    <input name="MenuAnimation" type="checkbox" value="true" />
    <span>Fade or slide menus into view</span>
  </label>
  <label class="checkbox">
    <input name="TooltipAnimation" type="checkbox" value="true" />
    <span>Fade or slide ToolTips into view</span>
  </label>
  <label class="checkbox">
    <input name="SelectionFade" type="checkbox" value="true" />
    <span>Fade out menu items after clicking</span>
  </label>
  <label class="checkbox">
    <input name="DWMSaveThumbnailEnabled" type="checkbox" value="true" />
    <span>Save taskbar thumbnail previews</span>
  </label>
  <label class="checkbox">
    <input name="CursorShadow" type="checkbox" value="true" />
    <span>Show shadows under mouse pointer</span>
  </label>
  <label class="checkbox">
    <input name="ListviewShadow" type="checkbox" value="true" />
    <span>Use drop shadows for icon labels on the desktop</span>
  </label>
  <label class="checkbox">
    <input name="ThumbnailsOrIcon" type="checkbox" value="true" />
    <span>Show thumbnails instead of icons</span>
  </label>
  <label class="checkbox">
    <input name="ListviewAlphaSelect" type="checkbox" value="true" />
    <span>Show translucent selection rectangle</span>
  </label>
  <label class="checkbox">
    <input name="DragFullWindows" type="checkbox" value="true" />
    <span>Show window contents while dragging</span>
  </label>
  <label class="checkbox">
    <input name="ComboBoxAnimation" type="checkbox" value="true" />
    <span>Slide open combo boxes</span>
  </label>
  <label class="checkbox">
    <input name="FontSmoothing" type="checkbox" value="true" />
    <span>Smooth edges of screen fonts</span>
  </label>
  <label class="checkbox">
    <input name="ListBoxSmoothScrolling" type="checkbox" value="true" />
    <span>Smooth-scroll list boxes</span>
  </label>
  <label class="checkbox">
    <input name="DropShadow" type="checkbox" value="true" />
    <span>Show shadows under windows</span>
  </label>
</div>
            </fieldset>
          </div>

        </td>
      </tr>
