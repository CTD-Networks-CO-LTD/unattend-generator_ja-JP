<tr>
        <th>Folders on Start:</th>
        <td>
          <div class="IndentContainer">
            <label class="radio">
              <input type="radio" name="StartFoldersMode" value="Default" checked="checked" />
              <span>Show default folders on Start next to the Power button</span>
            </label>
          </div>

          <div class="IndentContainer">
            <label class="radio">
              <input type="radio" name="StartFoldersMode" value="Custom" />
              <span>Show these folders:</span>
            </label>
            <fieldset>
              <div class="StartFolders CheckboxList">
  <label class="checkbox">
    <input name="StartFolderDocuments" type="checkbox" value="true" />
    <span>Documents</span>
  </label>
  <label class="checkbox">
    <input name="StartFolderDownloads" type="checkbox" value="true" />
    <span>Downloads</span>
  </label>
  <label class="checkbox">
    <input name="StartFolderFileExplorer" type="checkbox" value="true" />
    <span>File Explorer</span>
  </label>
  <label class="checkbox">
    <input name="StartFolderMusic" type="checkbox" value="true" />
    <span>Music</span>
  </label>
  <label class="checkbox">
    <input name="StartFolderNetwork" type="checkbox" value="true" />
    <span>Network</span>
  </label>
  <label class="checkbox">
    <input name="StartFolderPersonalFolder" type="checkbox" value="true" />
    <span>Personal Folder</span>
  </label>
  <label class="checkbox">
    <input name="StartFolderPictures" type="checkbox" value="true" />
    <span>Pictures</span>
  </label>
  <label class="checkbox">
    <input name="StartFolderSettings" type="checkbox" value="true" />
    <span>Settings</span>
  </label>
  <label class="checkbox">
    <input name="StartFolderVideos" type="checkbox" value="true" />
    <span>Videos</span>
  </label>
</div>
            </fieldset>
          </div>
          <p>
            This setting has no effect on Windows 10. On Windows 11, the folders will appear on the Start menu as follows:
            <img src="StartFolders.png" width="558" height="57" alt="" />
          </p>
        </td>
      </tr>
