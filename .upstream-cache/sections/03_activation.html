<tr>
        <th>Activation:</th>
        <td>
          <div class="IndentContainer">
            <label class="radio">
              <input type="checkbox" name="UseActivationKey" value="true" />
              <span>Use this product key to activate Windows:</span>
            </label>
            <fieldset>
              <input type="text" name="ActivationKey" value="" maxlength="29" required="required" class="ProductKey" pattern="^([a-zA-Z0-9]{5}-){4}[a-zA-Z0-9]{5}$" size="35" />
            </fieldset>
            <div>If you have already entered a product key above, you do not need to repeat that key here.</div>
          </div>
        </td>
      </tr>
