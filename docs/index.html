        {

            '21_lock_keys.html',
            '22_sticky_keys.html',
            '23_personalization.html',
            '24_remove_bloatware.html',
            '25_custom_scripts.html',
            '26_applocker.html',
            '27_xml_components.html',
            '28_download_settings.html',
            '29_submit_form.html'
        ];

        try {
            const cacheBust = (typeof COMMIT_HASH !== 'undefined' && COMMIT_HASH) ? ('?v=' + COMMIT_HASH.substring(0, 7)) : ('?t=' + Date.now());
            const fetchOpts = { cache: 'no-cache' };
            const [headerHtml, presetsHtml, ...sectionsHtml] = await Promise.all([
                fetch('sections/header.html' + cacheBust, fetchOpts).then(r => { if (!r.ok) throw new Error('header.html load failed'); return r.text(); }),
                fetch('sections/presets.html' + cacheBust, fetchOpts).then(r => { if (!r.ok) throw new Error('presets.html load failed'); return r.text(); }),
                ...sectionFiles.map(f => fetch('sections/' + f + cacheBust, fetchOpts).then(r => { if (!r.ok) throw new Error(f + ' load failed'); return r.text(); }))
            ]);

            const headerContainer = document.getElementById('app-header');
            const presetsContainer = document.getElementById('app-presets');
            const tableContainer = document.getElementById('main-table');

            if (headerContainer) headerContainer.outerHTML = headerHtml;
            if (presetsContainer) presetsContainer.outerHTML = presetsHtml;
            if (tableContainer) {
                tableContainer.innerHTML = sectionsHtml.join('\n');
            }

            if (typeof updateHeaderCommitTime === 'function') {
                updateHeaderCommitTime();
            } else if (typeof UnattendEngine !== 'undefined' && typeof UnattendEngine.updateHeaderCommitTime === 'function') {
                UnattendEngine.updateHeaderCommitTime();
            }

            ready();
        } catch (err) {
            console.error('Error loading sections dynamically:', err)
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadSections);
    } else {
        loadSections();
    }
    function valid(element) {
        if (element) {
            element.setCustomValidity('');
        }
    }
    function invalid(element, message, event) {
        if (!element) return;
        element.setCustomValidity(message);
        if (event && event.target === element) {
            if (event.isTrusted) {
                element.reportValidity();
            }
        }
    }
    function change(elements) {
        if (!elements) return;
        function each(element) {
            if (element) {
                element.dispatchEvent(new Event('change'));
            }
        }
        if ('forEach' in elements) {
            for (const element of elements) {
                each(element);
            }
        }
        else {
            each(elements);
        }
    }
    function whenEdited(elements, callback) {
        whenEvent(['change', 'keyup', 'input', 'paste'], elements, callback);
    }
    function whenChanged(elements, callback) {
        whenEvent(['change'], elements, callback);
    }
    function whenClicked(elements, callback) {
        whenEvent(['click'], elements, callback);
    }
    function whenEvent(types, elements, callback) {
        if (!elements) return;
        function each(element) {
            if (!element) return;
            for (const type of types) {
                element.addEventListener(type, callback);
            }
        }
        if ('forEach' in elements) {
            for (const element of elements) {
                each(element);
            }
        }
        else {
            each(elements);
        }
    }
