<!DOCTYPE html>
<html lang=ja>
<head>
  <meta charset=utf-8>
  <title>unattend-generator - 処理中</title>
  <script type=text/javascript src=./unattend_config.js?v=53dcff0></script>
  <script type=text/javascript src=./unattend_engine.js?v=53dcff0></script>
  <script type=text/javascript>
    (function () {
      const pathname = window.location.pathname;
      const search = window.location.search;
      const params = new URLSearchParams(search);

      // パスからアクション（download / view / iso）を判定
      let actionType = 'download';
      if (pathname.includes('/view')) {
        actionType = 'view';
      } else if (pathname.includes('/iso')) {
        actionType = 'iso';
      }

      // クエリパラメータが存在する場合は即座に生成・処理
      if (search && search.length > 1) {
        window.addEventListener('DOMContentLoaded', function () {
          const formData = new FormData();
          for (const [key, value] of params.entries()) {
            formData.append(key, value);
          }
          if (window.UnattendXmlEngine) {
            window.UnattendXmlEngine.handleAction(actionType, formData).then(() => {
              // ダウンロード処理完了後、トップページへ自動リダイレクト（パラメータ維持）
              setTimeout(() => {
                const basePath = pathname.replace(/\/(download|view|iso)\/?.*$/, '/');
                window.location.href = basePath + search;
              }, 1500);
            });
          }
        });
      } else {
        // パラメータがない場合はトップページへリダイレクト
        const basePath = pathname.replace(/\/(download|view|iso)\/?.*$/, '/');
        window.location.href = basePath || './';
      }
    })();
  </script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;
      text-align: center;
      padding-top: 50px;
      color: #333;
    }
    .spinner {
      margin: 20px auto;
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #0078d4;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <h2>ファイルを生成しています...</h2>
  <div class=spinner></div>
  <p>自動的にダウンロードが開始されます。<br>開始されない場合は <a href=./>トップページ</a> をお試しください。</p>
</body>
</html>
