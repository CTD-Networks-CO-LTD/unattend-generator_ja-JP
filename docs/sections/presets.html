  <div class="Presets">
    <fieldset class="has-legend">
      <legend>Import .xml file generated by this service</legend>
      <form method="post" action="./" enctype="multipart/form-data" onsubmit="return false;">
        <input type="file" accept=".xml" id="Upload" name="Upload" />
        <button type="submit" formaction="./">Import file</button>
      </form>
    </fieldset>
    <fieldset class="has-legend">
      <legend>Presets</legend>
      <form method="get" action="./">
        <button type="submit" formaction="./">Reset form to default values</button>
      </form>
      <form method="get" action="./">
        <input type="hidden" name="Minimal" value="true" />
        <button type="submit" formaction="./">Configure for minimal output</button>
      </form>
      <form method="get" action="./">
        <input type="hidden" name="LocalUser" value="true" />
        <button type="submit" title="This will configure the form to generate a minimal file that only creates a single local user account named “Example” with no password." formaction="./">Just create one local user account</button>
      </form>
    </fieldset>
  </div>
